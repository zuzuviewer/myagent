# 模型与预算配置（TECHNICAL_DESIGN §3.1 M1 配置边界）
# 本文件不含任何密钥：API Key 只从环境变量 OPENAI_API_KEY 读取。
# 数据来源：https://api-docs.deepseek.com/zh-cn/quick_start/pricing/（2026-11-03 核实）

# 官方指定模型名。旧名 deepseek-v4-flash / deepseek-v4-flash-vision-exp 已下线，
# 仍可调用但由 DeepSeek-V4.1-Flash-1017 提供服务。
model: agnes-3.0-flash

# 单次模型 API 请求超时，不是整个任务的时长（任务预算属 M3，R-15）。
timeout: 60s

# 上下文窗口 = input 与 output 的总量上限。官方标注 deepseek-flash 为 1M。
# 这里取 1000000 而不是 1048576：估大会撞到 API 超限错误（硬失败），
# 估小只会让我们自己的预算提前触发（软失败）。估不准时一律向安全方向偏。
max_context_tokens: 500000

# 单次请求的输出上限。官方能力上限为 384K（393216），但那是"最大能生成多少"，
# 不是推荐值：预留值越大，M3 派生出的可用输入预算越小（§3.6 公式）。
# 原值 1024000 超出官方范围，会被 API 直接 400 拒绝。
max_output_tokens: 16384

# DeepSeek 官方 OpenAI 格式 Base URL 不含 /v1。约定是"Base URL = /chat/completions
# 之前的部分"，由 Provider 拼接路径，因此 OpenAI 写 .../v1、DeepSeek 写 ...api.deepseek.com，
# 两者都符合这一约定。
base_url: https://api.agnes-ai.cn/v1

# 单价：每 1M tokens，货币单位为人民币元（DeepSeek 按元计费，OpenAI 按美元计费）。
# DeepSeek 实际有 4 档价（缓存命中/未命中 × 高峰/空闲，空闲为高峰的一半）。
# M1 无法感知缓存与时段，取最贵的一档（高峰 + 缓存未命中）以避免低估成本。
currency: CNY            # 只接受 USD / CNY；缺省会落到 USD，下面的元价就会被当成美元
input_price_per_mtok: 0.0    # 高峰、缓存未命中；缓存命中仅 0.02~0.04
output_price_per_mtok: 0.0   # 高峰价；空闲时段为 4
